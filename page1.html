<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>VOGUE — SONA | Special Edition</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<link rel="icon" type="image/png" href="favicon.png">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    font-family:'Cormorant Garamond', serif;
    padding:20px;
  }

  .cover {
    position:relative;
    width:520px;
    height:740px;
    background:#111;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.8);
  }

  /* ── ՆԿԱՐ ── */
  .photo {
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    z-index:1;
    filter:contrast(1.05) saturate(0.95);
  }

  /* Մուգ շերտ */
  .overlay {
    position:absolute;
    inset:0;
    background:linear-gradient(
      180deg,
      rgba(0,0,0,0.5) 0%,
      rgba(0,0,0,0.1) 25%,
      rgba(0,0,0,0.05) 50%,
      rgba(0,0,0,0.3) 75%,
      rgba(0,0,0,0.85) 100%
    );
    z-index:2;
  }

  /* ── ՓԱՅԼՈՑ ԱՍՏՂԻԿՆԵՐ ── */
  .sparkle {
    position:absolute;
    color:rgba(232,213,168,0.85);
    text-shadow:
      0 0 12px rgba(201,169,97,1),
      0 0 22px rgba(201,169,97,0.6);
    z-index:3;
    pointer-events:none;
    will-change: opacity, transform;
    transform: translateZ(0);
  }

  .sp1 { top:6%; left:10%; font-size:18px; animation:sparkle 3s ease-in-out infinite; }
  .sp2 { top:11%; right:12%; font-size:22px; animation:sparkle 4s ease-in-out infinite 0.5s; }
  .sp3 { top:28%; left:6%; font-size:16px; animation:sparkle 3.5s ease-in-out infinite 1s; }
  .sp4 { top:42%; right:8%; font-size:20px; animation:sparkle 3.8s ease-in-out infinite 1.5s; }
  .sp5 { bottom:32%; left:12%; font-size:14px; animation:sparkle 4.2s ease-in-out infinite 2s; }
  .sp6 { bottom:22%; right:10%; font-size:18px; animation:sparkle 3.6s ease-in-out infinite 2.5s; }
  .sp7 { top:58%; left:48%; font-size:12px; animation:sparkle 3.9s ease-in-out infinite 3s; }
  .sp8 { top:22%; left:42%; font-size:15px; animation:sparkle 4.4s ease-in-out infinite 3.5s; }

  @keyframes sparkle {
    0%, 100% { opacity:0.3; transform:translateZ(0) scale(0.8) rotate(0deg); }
    50% { opacity:1; transform:translateZ(0) scale(1.3) rotate(30deg); }
  }

  /* ── ՎԵՐԵՎԻ ՓԱՅԼ ── */
  .top-glow {
    position:absolute;
    top:-100px;
    left:50%;
    transform:translateX(-50%);
    width:400px;
    height:200px;
    background:radial-gradient(ellipse, rgba(201,169,97,0.3) 0%, transparent 70%);
    z-index:3;
    pointer-events:none;
  }

  /* ── VOGUE ── */
  .vogue {
    position:absolute;
    top:22px;
    left:0;
    right:0;
    text-align:center;
    z-index:4;
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:112px;
    letter-spacing:14px;
    background:linear-gradient(180deg, #f5e8d0 0%, #ffffff 40%, #e8d5a8 70%, #c9a961 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1;
    filter:drop-shadow(0 4px 20px rgba(0,0,0,0.6));
    margin-left:14px;
    padding-bottom:6px;
  }

  /* ── ԱՄՍԱԹԻՎ ── */
  .issue {
    position:absolute;
    top:140px;
    left:0;
    right:0;
    text-align:center;
    z-index:4;
    color:#fff;
    font-family:'Montserrat', sans-serif;
    font-size:11px;
    font-weight:600;
    letter-spacing:8px;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,0.7);
  }

  .issue::before,
  .issue::after {
    content:"";
    display:inline-block;
    width:40px;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(232,213,168,0.8), transparent);
    vertical-align:middle;
    margin:0 14px;
  }

  /* ── SONA ── */
  .sona-hero {
    position:absolute;
    top:158px;
    left:0;
    right:0;
    text-align:center;
    z-index:4;
    color:#fff;
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:82px;
    letter-spacing:20px;
    line-height:1;
    text-shadow:
      0 4px 30px rgba(0,0,0,0.9),
      0 0 60px rgba(0,0,0,0.6);
    margin-left:20px;
  }

  .sona-sub {
    position:absolute;
    top:248px;
    left:0;
    right:0;
    text-align:center;
    z-index:4;
    color:#e8d5a8;
    font-family:'Montserrat', sans-serif;
    font-size:10px;
    font-weight:700;
    letter-spacing:6px;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,0.8);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:12px;
  }

  .sona-sub::before,
  .sona-sub::after {
    content:"✦";
    color:#c9a961;
    font-size:10px;
    animation:sparkle 2.5s ease-in-out infinite;
  }

  /* ── ԿՈՂՄԵՐԻ HEADLINE-ՆԵՐ ── */
  .left-col {
    position:absolute;
    top:400px;
    left:28px;
    z-index:4;
    color:#fff;
    max-width:180px;
  }

  .right-col {
    position:absolute;
    top:400px;
    right:28px;
    z-index:4;
    color:#fff;
    text-align:right;
    max-width:170px;
  }

  .hl-big {
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:22px;
    letter-spacing:2px;
    line-height:1.15;
    text-transform:uppercase;
    text-shadow:0 3px 12px rgba(0,0,0,0.9);
    margin-bottom:6px;
  }

  .hl-small {
    font-family:'Montserrat', sans-serif;
    font-size:9px;
    font-weight:600;
    letter-spacing:4px;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,0.9);
    margin-bottom:14px;
    opacity:0.95;
  }

  .hl-item {
    font-family:'Cormorant Garamond', serif;
    font-size:13px;
    font-weight:600;
    letter-spacing:4px;
    text-transform:uppercase;
    text-shadow:0 2px 8px rgba(0,0,0,0.9);
    margin-bottom:6px;
  }

  .divider {
    width:30px;
    height:1px;
    background:linear-gradient(90deg, rgba(232,213,168,0.9), transparent);
    margin:10px 0;
  }
  .right-col .divider {
    margin-left:auto;
    background:linear-gradient(90deg, transparent, rgba(232,213,168,0.9));
  }

  /* ── ՆԵՐՔԵՎԻ ՄԱՍ ── */
  .bottom {
    position:absolute;
    bottom:0;
    left:0;
    right:0;
    z-index:4;
    padding:24px 28px 20px;
    color:#fff;
  }

  .bottom-line {
    width:100%;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(232,213,168,0.9),transparent);
    margin-bottom:14px;
  }

  .tagline {
    text-align:center;
    font-family:'Montserrat', sans-serif;
    font-size:9px;
    font-weight:600;
    letter-spacing:6px;
    text-transform:uppercase;
    color:#e8d5a8;
    margin-bottom:16px;
    text-shadow:0 2px 8px rgba(0,0,0,0.9);
    display:flex;
    align-items:center;
    justify-content:center;
    gap:8px;
  }

  .tagline::before,
  .tagline::after {
    content:"✦";
    font-size:10px;
    color:#c9a961;
    animation:sparkle 3s ease-in-out infinite;
  }

  .bottom-row {
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
  }

  .bottom-left {
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:15px;
    line-height:1.3;
    letter-spacing:1px;
    text-shadow:0 3px 10px rgba(0,0,0,0.9);
  }

  .bottom-right {
    text-align:right;
    font-family:'Montserrat', sans-serif;
    font-size:9px;
    font-weight:600;
    letter-spacing:4px;
    text-transform:uppercase;
    line-height:1.9;
    text-shadow:0 2px 8px rgba(0,0,0,0.9);
  }

  /* ── ՖՈՒՏԵՐ ── */
  .footer {
    position:absolute;
    bottom:6px;
    left:0;
    right:0;
    text-align:center;
    z-index:5;
    font-family:'Montserrat', sans-serif;
    font-size:7px;
    font-weight:400;
    letter-spacing:5px;
    text-transform:uppercase;
    color:rgba(255,255,255,0.55);
  }

  /* ── ՈՍԿԵ ԱՆԿՅՈՒՆՆԵՐ ── */
  .corner {
    position:absolute;
    width:50px;
    height:50px;
    border:1.5px solid rgba(232,213,168,0.7);
    z-index:4;
  }
  .corner.tl {
    top:10px; left:10px;
    border-right:none; border-bottom:none;
    border-top-left-radius:8px;
  }
  .corner.tr {
    top:10px; right:10px;
    border-left:none; border-bottom:none;
    border-top-right-radius:8px;
  }
  .corner.bl {
    bottom:10px; left:10px;
    border-right:none; border-top:none;
    border-bottom-left-radius:8px;
  }
  .corner.br {
    bottom:10px; right:10px;
    border-left:none; border-top:none;
    border-bottom-right-radius:8px;
  }

</style>
</head>
<body>

<div class="cover">

  <!-- ՍՈՆԱՅԻ ՆԿԱՐԸ -->
  <img src="sona5.png" class="photo" alt="Sona">

  <!-- Մուգ շերտ -->
  <div class="overlay"></div>

  <!-- Վերևի փայլ -->
  <div class="top-glow"></div>

  <!-- Փայլոց աստղիկներ -->
  <div class="sparkle sp1">✦</div>
  <div class="sparkle sp2">✧</div>
  <div class="sparkle sp3">✦</div>
  <div class="sparkle sp4">✧</div>
  <div class="sparkle sp5">✦</div>
  <div class="sparkle sp6">✧</div>
  <div class="sparkle sp7">✦</div>
  <div class="sparkle sp8">✧</div>

  <!-- Ոսկե անկյուններ -->
  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- VOGUE — Ոսկե փայլով -->
  <div class="vogue">VOGUE</div>

  <!-- ԱՄՍԱԹԻՎ -->
  <div class="issue">October 2026</div>

  <!-- SONA -->
  <div class="sona-hero">SONA</div>
  <div class="sona-sub">The New Face of Beauty</div>

  <!-- Ձախ սյունակ -->
  <div class="left-col">
    <div class="hl-big">Dentistry</div>
    <div class="divider"></div>
    <div class="hl-big">Dance</div>
    <div class="divider"></div>
    <div class="hl-big">Greek Dance</div>
    <div class="divider"></div>
    <div class="hl-small" style="margin-top:14px;">Passion • Elegance • Confidence</div>
  </div>

  <!-- Աջ սյունակ -->
  <div class="right-col">
    <div class="hl-item">Beauty</div>
    <div class="hl-item">Student</div>
    <div class="hl-item">Dancer</div>
    <div class="hl-item">Dreamer</div>
    <div class="divider"></div>
    <div class="hl-big" style="font-size:18px;">The Art of<br>Being Yourself</div>
  </div>

  <!-- Ներքևի մաս -->
  <div class="bottom">
    <div class="bottom-line"></div>
    <div class="tagline">Special Birthday Edition</div>
    <div class="bottom-row">
      <div class="bottom-left">
        Sona<br>
        <span style="font-size:10px; letter-spacing:3px; font-style:normal; font-family:'Montserrat',sans-serif; font-weight:600; text-transform:uppercase; opacity:0.85;">A New Generation of Women</span>
      </div>
      <div class="bottom-right">
        Beauty<br>
        Elegance<br>
        Confidence
      </div>
    </div>
  </div>

  <div class="footer">Vogue • Special Edition • 2026</div>

</div>

</body>
</html>
