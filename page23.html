<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VOGUE — Back Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#0d0d0d;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    padding:20px;
    font-family:'Cormorant Garamond', serif;
  }

  .cover {
    position:relative;
    width:520px;
    height:740px;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.8);
    background:#f5f0e8;
  }

  /* ═══════════════════════════════════
     ՆԿԱՐԸ
     ═══════════════════════════════════ */
  .cover-img {
    width:100%;
    height:100%;
    object-fit:cover;
    display:block;
  }

  /* ═══════════════════════════════════
     ՈՍԿԵ ՇՐՋԱՆԱԿ
     ═══════════════════════════════════ */
  .cover::after {
    content:"";
    position:absolute;
    inset:14px;
    border:1px solid rgba(201,169,97,0.6);
    pointer-events:none;
    z-index:5;
  }

  /* ═══════════════════════════════════
     ՎԵՐԵՎԻ ԱՋ — ԱՄՍԱԹԻՎ
     ═══════════════════════════════════ */
  .issue-date {
    position:absolute;
    top:15px;
    right:30px;
    text-align:right;
    z-index:10;
    font-family:'Montserrat', sans-serif;
  }

  .issue-date-main {
    font-size:11px;
    font-weight:700;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#1a1a1a;
    margin-bottom:4px;
    text-shadow:0 1px 4px rgba(255,255,255,0.6);
  }

  .issue-date-sub {
    font-size:8px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#4a3f28;
    text-shadow:0 1px 4px rgba(255,255,255,0.6);
  }

  /* ═══════════════════════════════════
     ՎԵՐԵՎԻ ՁԱԽ — SONA
     ═══════════════════════════════════ */
  .sona-tag {
    position:absolute;
    top:150px;
    left:30px;
    z-index:10;
  }

  .sona-tag-name {
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:26px;
    letter-spacing:5px;
    background:linear-gradient(180deg, #c9a961 0%, #8a6f3d 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1;
    margin-bottom:6px;
    text-shadow:0 2px 6px rgba(255,255,255,0.4);
  }

  .sona-tag-sub {
    font-family:'Montserrat', sans-serif;
    font-size:7px;
    font-weight:600;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#4a3f28;
    text-shadow:0 1px 4px rgba(255,255,255,0.6);
  }

  /* ═══════════════════════════════════
     ՆԵՐՔԵՎԻ ՁԱԽ — ՇՏՐԻԽ ԿՈԴ
     ═══════════════════════════════════ */
  .barcode-box {
    position:absolute;
    bottom:30px;
    left:30px;
    z-index:10;
    background:rgba(255,255,255,0.92);
    padding:10px 12px 8px;
    border:1px solid rgba(0,0,0,0.15);
    box-shadow:0 4px 15px rgba(0,0,0,0.15);
  }

  .barcode-lines {
    width:100px;
    height:36px;
    background:repeating-linear-gradient(
      90deg,
      #1a1a1a 0,
      #1a1a1a 2px,
      transparent 2px,
      transparent 3px,
      #1a1a1a 3px,
      #1a1a1a 6px,
      transparent 6px,
      transparent 8px,
      #1a1a1a 8px,
      #1a1a1a 9px,
      transparent 9px,
      transparent 12px,
      #1a1a1a 12px,
      #1a1a1a 14px,
      transparent 14px,
      transparent 17px,
      #1a1a1a 17px,
      #1a1a1a 21px,
      transparent 21px,
      transparent 23px,
      #1a1a1a 23px,
      #1a1a1a 25px,
      transparent 25px,
      transparent 28px,
      #1a1a1a 28px,
      #1a1a1a 32px,
      transparent 32px,
      transparent 34px
    );
    margin-bottom:5px;
  }

  .barcode-number {
    font-family:'Montserrat', sans-serif;
    font-size:7px;
    font-weight:600;
    letter-spacing:3px;
    text-align:center;
    color:#1a1a1a;
  }

  /* ═══════════════════════════════════
     ՆԵՐՔԵՎԻ ԿԵՆՏՐՈՆ — TAGLINE
     ═══════════════════════════════════ */
  .tagline {
    position:absolute;
    bottom:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    text-align:center;
    white-space:nowrap;
  }

  .tagline-text {
    font-family:'Montserrat', sans-serif;
    font-size:9px;
    font-weight:700;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#1a1a1a;
    text-shadow:0 1px 6px rgba(255,255,255,0.8);
  }

  .tagline-dots {
    color:#8a6f3d;
    margin:0 4px;
  }

  /* ═══════════════════════════════════
     ՆԵՐՔԵՎԻ ԱՋ — ԳԻՆ
     ═══════════════════════════════════ */
  .price-tag {
    position:absolute;
    bottom:30px;
    right:30px;
    z-index:10;
    text-align:right;
    font-family:'Montserrat', sans-serif;
  }

  .price-main {
    font-size:10px;
    font-weight:700;
    letter-spacing:3px;
    color:#1a1a1a;
    text-shadow:0 1px 4px rgba(255,255,255,0.6);
    margin-bottom:4px;
  }

  .price-issue {
    font-size:7px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#4a3f28;
    text-shadow:0 1px 4px rgba(255,255,255,0.6);
  }

  /* ═══════════════════════════════════
     VOGUE ՄԵԾ ՏԱՌԵՐ (ներքևի մասում, փոքր)
     ═══════════════════════════════════ */
  .vogue-mini {
    position:absolute;
    bottom:60px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:22px;
    letter-spacing:8px;
    color:rgba(255,255,255,0.9);
    text-shadow:0 2px 10px rgba(0,0,0,0.4);
    margin-left:8px;
  }

  /* ═══════════════════════════════════
     QR ԿՈԴ — ՎԵՐԵՎԻ ԿԵՆՏՐՈՆ (ըստ ցանկության)
     ═══════════════════════════════════ */
  .qr-corner {
    position:absolute;
    top:30px;
    left:50%;
    transform:translateX(-50%);
    z-index:10;
    background:#fff;
    padding:5px;
    border:1px solid rgba(201,169,97,0.6);
    box-shadow:0 4px 15px rgba(0,0,0,0.2);
  }

  .qr-corner img {
    width:55px;
    height:55px;
    display:block;
  }

  .qr-label {
    font-family:'Montserrat', sans-serif;
    font-size:5.5px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    color:#1a1a1a;
    text-align:center;
    margin-top:3px;
  }

  /* ═══════════════════════════════════
     ՄՈԲԱՅԼ
     ═══════════════════════════════════ */
  @media (max-width: 600px) {
    .cover {
      width:100%;
      max-width:520px;
      height:auto;
      aspect-ratio:520/740;
    }

    .sona-tag-name { font-size:20px; letter-spacing:3px; }
    .issue-date-main { font-size:9px; letter-spacing:3px; }
    .issue-date-sub { font-size:6.5px; }
    .sona-tag-sub { font-size:6px; }
    .barcode-lines { width:80px; height:30px; }
    .barcode-number { font-size:6px; }
    .tagline-text { font-size:7px; letter-spacing:3px; }
    .price-main { font-size:8px; }
    .price-issue { font-size:6px; }
    .vogue-mini { font-size:16px; letter-spacing:5px; }
    .qr-corner img { width:40px; height:40px; }
  }
</style>
</head>
<body>

<div class="cover">

  <!-- 👇 ՓՈԽԻՐ "back-cover.jpg" ՔՈ ՆԿԱՐԻ ԱՆՈՒՆՈՎ 👇 -->
  <img src="Vogue fashion magazine cover.png" class="cover-img" alt="Sona - Back Cover">

  <!-- ═══ ՎԵՐԵՎԻ ՁԱԽ — SONA ═══ -->
  <div class="sona-tag">
    <div class="sona-tag-name">SONA</div>
    <div class="sona-tag-sub">The New Face of Style</div>
  </div>

  <!-- ═══ ՎԵՐԵՎԻ ԱՋ — ԱՄՍԱԹԻՎ ═══ -->
  <div class="issue-date">
    <div class="issue-date-main">October 2026</div>
    <div class="issue-date-sub">Special Edition</div>
  </div>

  <!-- ═══ VOGUE ՄԻՆԻ ═══ -->
  <div class="vogue-mini">VOGUE</div>

  <!-- ═══ ՆԵՐՔԵՎԻ ՁԱԽ — ՇՏՐԻԽ ԿՈԴ ═══ -->
  <div class="barcode-box">
    <div class="barcode-lines"></div>
    <div class="barcode-number">1 1 1 0 2 0 2 6</div>
  </div>


  <!-- ═══ ՆԵՐՔԵՎԻ ԱՋ — ԳԻՆ ═══ -->
  <div class="price-tag">
    <div class="price-main">№ 23</div>
    <div class="price-issue">Birthday Issue</div>
  </div>

</div>

</body>
</html>
