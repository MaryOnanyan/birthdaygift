<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>VOGUE — Color It Your Way</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<link rel="icon" type="image/png" href="favicon.png">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d0d0d;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; padding:20px;
    font-family:'Cormorant Garamond', serif;
  }

  .page {
    position:relative;
    width:520px; height:740px;
    background:#faf8f2;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.8);
    padding:22px 28px 18px;
    display:flex; flex-direction:column;
  }

  .corner { position:absolute; width:40px; height:40px;
    border:1px solid rgba(201,169,97,0.7); z-index:10; }
  .corner.tl { top:14px; left:14px; border-right:none; border-bottom:none; }
  .corner.tr { top:14px; right:14px; border-left:none; border-bottom:none; }
  .corner.bl { bottom:14px; left:14px; border-right:none; border-top:none; }
  .corner.br { bottom:14px; right:14px; border-left:none; border-top:none; }

  .header {
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:6px; border-bottom:1px solid rgba(0,0,0,0.15);
    margin-bottom:8px;
  }
  .header-left {
    font-family:'Playfair Display', serif;
    font-style:italic; font-weight:900; font-size:18px;
    letter-spacing:4px; color:#1a1a1a;
  }
  .header-right {
    font-family:'Montserrat', sans-serif; font-size:6.5px;
    font-weight:600; letter-spacing:4px; text-transform:uppercase;
    color:#8a7a5c; text-align:right;
  }

  .page-label {
    text-align:center; font-family:'Montserrat', sans-serif;
    font-size:6.5px; font-weight:600; letter-spacing:7px;
    text-transform:uppercase; color:#c9a961; margin-bottom:4px;
  }

  .title {
    text-align:center; font-family:'Playfair Display', serif;
    font-weight:900; font-style:italic; font-size:20px;
    line-height:1.15; color:#1a1a1a; margin-bottom:3px;
  }

  .subtitle {
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:11px;
    color:#8a7a5c;
    margin-bottom:4px;
    letter-spacing:1px;
  }

  .title-ornament {
    text-align:center; color:#c9a961; font-size:10px;
    letter-spacing:7px; margin-bottom:8px;
  }

  /* ═══════════════════════════════════
     ԳՈՒՆԱԶԱՐԴՄԱՆ ՇՐՋԱՆԱԿ — ԱՎԵԼԻ ՄԵԾ
     ═══════════════════════════════════ */
  .coloring-frame {
    flex:1;
    position:relative;
    background:#fff;
    border:2px solid #1a1a1a;
    border-radius:2px;
    padding:4px;
    box-shadow:0 10px 30px rgba(0,0,0,0.12);
    display:flex;
    flex-direction:column;
    margin-bottom:8px;
    overflow:hidden;
    min-height:0;
  }

  .coloring-frame::before,
  .coloring-frame::after {
    content:"";
    position:absolute;
    width:18px; height:18px;
    border:2px solid #c9a961;
    z-index:5;
  }
  .coloring-frame::before {
    top:3px; left:3px;
    border-right:none; border-bottom:none;
  }
  .coloring-frame::after {
    bottom:3px; right:3px;
    border-left:none; border-top:none;
  }

  .frame-number {
    position:absolute;
    top:-2px; right:12px;
    background:#1a1a1a;
    color:#fff;
    font-family:'Montserrat', sans-serif;
    font-size:9px;
    font-weight:700;
    letter-spacing:2px;
    padding:3px 10px;
    z-index:6;
  }

  .coloring-image {
    width:100%;
    height:100%;
    object-fit:contain;
    display:block;
  }

  /* ═══════════════════════════════════
     ԳՈՒՆԱՎՈՐ ՕՐԻՆԱԿ — ԱՎԵԼԻ ՄԵԾ
     ═══════════════════════════════════ */
  .color-example {
    position:absolute;
    bottom:12px;
    right:12px;
    z-index:7;
    background:#fff;
    padding:4px;
    border:2px solid #c9a961;
    box-shadow:0 6px 20px rgba(0,0,0,0.3);
    transform:rotate(-3deg);
    transition:all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }

  .color-example:hover {
    transform:rotate(0deg) scale(1.08);
    box-shadow:0 10px 30px rgba(201,169,97,0.5);
    z-index:20;
  }

  .color-example img {
    width:110px;
    height:110px;
    object-fit:cover;
    display:block;
  }

  .color-example-label {
    position:absolute;
    top:-9px;
    left:50%;
    transform:translateX(-50%);
    background:#1a1a1a;
    color:#e8d5a8;
    font-family:'Montserrat', sans-serif;
    font-size:6px;
    font-weight:700;
    letter-spacing:2px;
    text-transform:uppercase;
    padding:3px 8px;
    white-space:nowrap;
    border:1px solid rgba(201,169,97,0.5);
  }

  /* ── ԿՈՃԱԿՆԵՐԻ ՏՈՒՊ ── */
  .palette {
    display:flex;
    justify-content:center;
    gap:9px;
    margin-bottom:8px;
  }

  .color-dot {
    width:20px; height:20px;
    border-radius:50%;
    border:2px solid #fff;
    box-shadow:0 2px 8px rgba(0,0,0,0.15);
    cursor:pointer;
    transition:transform 0.2s;
  }

  .color-dot:hover { transform:scale(1.15); }

  .c1 { background:#1a1a1a; }
  .c2 { background:#c9a961; }
  .c3 { background:#b76e79; }
  .c4 { background:#4a5568; }
  .c5 { background:#f5f0e8; }

  /* ── ՏԵՔՍՏ ── */
  .quote-block {
    text-align:center;
    padding:9px 14px;
    background:linear-gradient(135deg,#fff 0%,#faf6ee 100%);
    border:1px solid rgba(201,169,97,0.4);
    position:relative;
  }

  .quote-text {
    font-family:'Cormorant Garamond', serif;
    font-size:11px;
    line-height:1.5;
    color:#2a2a2a;
    font-style:italic;
  }

  .quote-text em {
    font-style:normal;
    font-weight:600;
    color:#1a1a1a;
    background:linear-gradient(180deg, transparent 60%, rgba(201,169,97,0.4) 60%);
    padding:0 2px;
  }

  .quote-signature {
    font-family:'Montserrat', sans-serif;
    font-size:6.5px;
    font-weight:600;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#c9a961;
    margin-top:7px;
    padding-top:6px;
    border-top:1px solid rgba(201,169,97,0.3);
  }

  .footer {
    display:flex; justify-content:space-between; align-items:center;
    padding-top:6px; border-top:1px solid rgba(0,0,0,0.15);
    margin-top:8px;
  }
  .page-number {
    font-family:'Playfair Display', serif;
    font-style:italic; font-size:14px; color:#c9a961;
  }
  .footer-text {
    font-family:'Montserrat', sans-serif; font-size:6.5px;
    font-weight:600; letter-spacing:4px; text-transform:uppercase;
    color:#8a7a5c;
  }
</style>
</head>
<body>

<div class="page">

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="header">
    <div class="header-left">Vogue</div>
    <div class="header-right">
      October 2026<br>
      Special Edition
    </div>
  </div>

  <div class="page-label">Vogue Creative • Color It Your Way</div>
  <div class="title">«Ներկիր այն քո ոճով»</div>
  <div class="subtitle">— Սոնա լինելու արվեստը —</div>
  <div class="title-ornament">✦ ✦ ✦</div>

  <!-- ═══════════════════════════════════
       ԳՈՒՆԱԶԱՐԴՄԱՆ ՇՐՋԱՆԱԿ
       ═══════════════════════════════════ -->
  <div class="coloring-frame">
    <div class="frame-number">03</div>

    <!-- 👇 ՄԵԾ ՈՒՐՎԱԳԻԾ 👇 -->
    <img src="3.png" class="coloring-image" alt="Coloring page 3">

    <!-- 👇 ԳՈՒՆԱՎՈՐ ՕՐԻՆԱԿ 👇 -->
    <div class="color-example">
      <div class="color-example-label">Example</div>
      <img src="33.jpg" alt="Colored example 3">
    </div>

  </div>

  <!-- Կոճակների տուփ -->
  <div class="palette">
    <div class="color-dot c1"></div>
    <div class="color-dot c2"></div>
    <div class="color-dot c3"></div>
    <div class="color-dot c4"></div>
    <div class="color-dot c5"></div>
  </div>

  <!-- Տեքստ -->
  <div class="quote-block">
    <div class="quote-text">
      Ամեն մեծ նկարիչ սկսել է դատարկ էջից։ Այս նկարը քոնն է՝ ամբողջովին։ Ոչ ոք չի ասի՝ ինչպես պետք է լինի։ Միայն դու։
    </div>
    <div class="quote-signature">Your Canvas • Your Rules</div>
  </div>

  <div class="footer">
    <div class="page-number">17</div>
    <div class="footer-text">Vogue • Creative Edition</div>
  </div>

</div>

</body>
</html>
