<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>VOGUE SONA — Print Version</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  
  body {
    background:#333;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:30px 0;
    font-family:'Cormorant Garamond', serif;
  }
  
  /* Print կոճակ */
  .print-btn {
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;
    background:linear-gradient(160deg,#c9a961,#8a6f3d);
    color:#fff;
    border:none;
    padding:14px 24px;
    font-family:'Montserrat', sans-serif;
    font-size:12px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    cursor:pointer;
    border-radius:2px;
    box-shadow:0 5px 20px rgba(201,169,97,0.5);
    transition:all 0.3s;
  }
  .print-btn:hover {
    transform:translateY(-2px);
    box-shadow:0 8px 30px rgba(201,169,97,0.7);
  }
  
  /* Բոլոր էջերը */
  iframe {
    width:520px;
    height:740px;
    border:none;
    margin-bottom:30px;
    background:#fff;
    box-shadow:0 10px 40px rgba(0,0,0,0.4);
  }
  
  /* Print ռեժիմում */
  @media print {
    @page {
      size: A4;
      margin: 0;
    }
    
    body {
      background:#fff;
      padding:0;
      margin:0;
    }
    
    .print-btn {
      display:none !important;
    }
    
    iframe {
      width:210mm !important;
      height:297mm !important;
      margin:0 !important;
      box-shadow:none !important;
      page-break-after:always;
      display:block;
    }
  }
</style>
</head>
<body>

<button class="print-btn" onclick="window.print()">🖨️ Տպել PDF</button>
