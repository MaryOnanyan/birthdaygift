<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>VOGUE — Rhythm of Life</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d0d0d;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; padding:20px;
    font-family:'Cormorant Garamond', serif;
  }

  .page {
    position:relative;
    width:520px; height:740px;
    background:#f5f0e8;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.8);
    padding:35px 40px 30px;
    display:flex; flex-direction:column;
  }

  .corner { position:absolute; width:40px; height:40px;
    border:1px solid rgba(201,169,97,0.7); z-index:10; }
  .corner.tl { top:14px; left:14px; border-right:none; border-bottom:none; }
  .corner.tr { top:14px; right:14px; border-left:none; border-bottom:none; }
  .corner.bl { bottom:14px; left:14px; border-right:none; border-top:none; }
  .corner.br { bottom:14px; right:14px; border-left:none; border-top:none; }

  .header {
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:10px; border-bottom:1px solid rgba(0,0,0,0.15);
    margin-bottom:14px;
  }
  .header-left {
    font-family:'Playfair Display', serif;
    font-style:italic; font-weight:900; font-size:20px;
    letter-spacing:4px; color:#1a1a1a;
  }
  .header-right {
    font-family:'Montserrat', sans-serif; font-size:7px;
    font-weight:600; letter-spacing:4px; text-transform:uppercase;
    color:#8a7a5c; text-align:right;
  }

  .page-label {
    text-align:center; font-family:'Montserrat', sans-serif;
    font-size:7px; font-weight:600; letter-spacing:7px;
    text-transform:uppercase; color:#c9a961; margin-bottom:6px;
  }

  .title {
    text-align:center; font-family:'Playfair Display', serif;
    font-weight:900; font-style:italic; font-size:24px;
    line-height:1.15; color:#1a1a1a; margin-bottom:4px;
  }
  .title-ornament {
    text-align:center; color:#c9a961; font-size:11px;
    letter-spacing:7px; margin-bottom:14px;
  }

  /* ── ԳԼԽԱՎՈՐ ՆԿԱՐ ── */
  .main-photo {
    position:relative;
    width:100%; height:200px;
    margin-bottom:10px;
    padding:6px; background:#fff;
    box-shadow:0 8px 25px rgba(0,0,0,0.15);
    transform:rotate(-0.8deg);
  }
  .main-photo::after {
    content:""; position:absolute; inset:6px;
    border:1px solid rgba(201,169,97,0.4);
    pointer-events:none;
  }
  .main-photo img {
    width:100%; height:100%;
    object-fit:cover; display:block;
    filter:sepia(0.08) contrast(1.03);
  }
  .main-photo .placeholder {
    width:100%; height:100%;
    background:linear-gradient(135deg,#e8ddd0 0%,#d4c5b0 100%);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    color:#8a7a5c; font-family:'Montserrat', sans-serif;
    font-size:9px; letter-spacing:3px; text-align:center;
    padding:10px;
  }
  .main-photo .placeholder span { font-size:32px; margin-bottom:6px; }

  /* ── ԵՐԿՈՒ ՓՈՔՐ ՆԿԱՐ ── */
  .duo {
    display:grid; grid-template-columns:1fr 1fr;
    gap:12px; margin-bottom:14px;
  }
  .duo-item {
    position:relative;
    height:130px;
    padding:5px; background:#fff;
    box-shadow:0 5px 18px rgba(0,0,0,0.12);
  }
  .duo-item:nth-child(1) { transform:rotate(-1.5deg); }
  .duo-item:nth-child(2) { transform:rotate(1.5deg); }
  .duo-item img {
    width:100%; height:100%;
    object-fit:cover; display:block;
    filter:sepia(0.08) contrast(1.03);
  }
  .duo-item .placeholder {
    width:100%; height:100%;
    background:linear-gradient(135deg,#e8ddd8 0%,#d4c5b0 100%);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    color:#8a7a5c; font-family:'Montserrat', sans-serif;
    font-size:8px; letter-spacing:2px; text-align:center;
    padding:8px;
  }
  .duo-item .placeholder span { font-size:22px; margin-bottom:4px; }

  /* ── ՄԵՋԲԵՐՎԱԾ ՆԱՄԱԿ ── */
  .quote-block {
    flex:1;
    position:relative;
    background:linear-gradient(135deg,#fff 0%,#faf6ee 100%);
    border:1px solid rgba(201,169,97,0.4);
    padding:18px 22px 16px;
    box-shadow:0 4px 15px rgba(0,0,0,0.06);
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .quote-block::before {
    content:"❝";
    position:absolute;
    top:-14px; left:16px;
    font-family:'Playfair Display', serif;
    font-size:48px;
    color:#c9a961;
    line-height:1;
    background:#f5f0e8;
    padding:0 8px;
  }

  .quote-text {
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:14.5px;
    line-height:1.6;
    color:#2a2a2a;
    text-align:center;
    letter-spacing:0.2px;
  }

  .quote-text em {
    font-style:normal;
    font-weight:600;
    color:#1a1a1a;
    border-bottom:1px solid rgba(201,169,97,0.6);
    padding-bottom:1px;
  }

  .quote-ornament {
    text-align:center;
    color:#c9a961;
    font-size:10px;
    letter-spacing:6px;
    margin-top:10px;
  }

  /* ── ՍՏՈՐԱԳՐՈՒԹՅՈՒՆ ── */
  .signature-line {
    text-align:center;
    font-family:'Montserrat', sans-serif;
    font-size:7px;
    font-weight:600;
    letter-spacing:5px;
    text-transform:uppercase;
    color:#c9a961;
    margin-top:12px;
  }

  .footer {
    display:flex; justify-content:space-between; align-items:center;
    padding-top:10px; border-top:1px solid rgba(0,0,0,0.15);
    margin-top:12px;
  }
  .page-number {
    font-family:'Playfair Display', serif;
    font-style:italic; font-size:15px; color:#c9a961;
  }
  .footer-text {
    font-family:'Montserrat', sans-serif; font-size:7px;
    font-weight:600; letter-spacing:4px; text-transform:uppercase;
    color:#8a7a5c;
  }
</style>
</head>
<body>

<div class="page">

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="header">
    <div class="header-left">Vogue</div>
    <div class="header-right">
      October 2026<br>
      Special Edition
    </div>
  </div>

  <div class="page-label">Rhythm of Life • Greek Dance</div>
  <div class="title">«Սիրտը խփում է<br>հունական ռիթմով»</div>
  <div class="title-ornament">✦ ✦ ✦</div>

  <!-- 👇 ԳԼԽԱՎՈՐ ՊԱՐԱՅԻՆ ՆԿԱՐ 👇 -->
  <div class="main-photo">
    <img src="dance-main.jpg" alt="Sona dancing">
    <!--
    <div class="placeholder">
      <span>💃</span>
      ՊԱՐԱՅԻՆ ՆԿԱՐ
    </div>
    -->
  </div>

  <!-- 👇 2 ՓՈՔՐ ՆԿԱՐ 👇 -->
  <div class="duo">
    <div class="duo-item">
      <img src="dance-1.jpg" alt="Dance moment 1">
      <!-- <div class="placeholder"><span>📷</span>ՆԿԱՐ 1</div> -->
    </div>
    <div class="duo-item">
      <img src="dance-2.jpg" alt="Dance moment 2">
      <!-- <div class="placeholder"><span>📷</span>ՆԿԱՐ 2</div> -->
    </div>
  </div>

  <!-- 👇 ՄԵՋԲԵՐՎԱԾ ՔՈ ՏԵՔՍՏԸ 👇 -->
  <div class="quote-block">
    <div class="quote-text">
      «Երբ երաժշտությունը սկսվում է, <em>ամեն ինչ կանգ է առնում</em>։ Բեմական այն էներգիան ու թեթևությունը, որը <em>միայն Սոնային է բնորոշ</em>»։
    </div>
    <div class="quote-ornament">✦ ✦ ✦</div>
  </div>

  <div class="signature-line">Passion • Rhythm • Soul</div>

  <div class="footer">
    <div class="page-number">10</div>
    <div class="footer-text">Vogue • Dance Edition</div>
  </div>

</div>

</body>
</html>
