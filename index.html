<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>VOGUE — SONA | Flipbook</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">

<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    background:
      radial-gradient(ellipse at 20% 10%, rgba(201,169,97,0.1) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 90%, rgba(201,169,97,0.08) 0%, transparent 50%),
      linear-gradient(160deg, #1a1a1a 0%, #0d0d0d 100%);
    min-height:100vh;
    font-family:'Cormorant Garamond', serif;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    padding:20px;
    color:#f5f0e8;
    overflow-x:hidden;
  }

  /* ═══════════════════════════════════
     ԿՈՃԱԿ — ՎԵՐԱԴԱՌՆԱԼ
     ═══════════════════════════════════ */
  .back-to-site {
    position:fixed;
    top:20px;
    right:20px;
    z-index:9999;
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 18px;
    font-family:'Montserrat', sans-serif;
    font-size:9px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#c9a961;
    text-decoration:none;
    background:rgba(13,13,13,0.85);
    border:1.5px solid rgba(201,169,97,0.5);
    border-radius:2px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    transition:all 0.3s ease;
    box-shadow:0 4px 15px rgba(0,0,0,0.3);
  }

  .back-to-site:hover {
    background:rgba(201,169,97,0.2);
    border-color:#c9a961;
    color:#e8d5a8;
    transform:translateY(-2px);
    box-shadow:0 8px 25px rgba(201,169,97,0.4);
  }

  .back-to-site-icon {
    font-size:12px;
  }

  /* ── ՎԵՐՆԱԳԻՐ ── */
  .magazine-header {
    text-align:center;
    margin-bottom:20px;
    flex-shrink:0;
  }

  .magazine-label {
    font-family:'Montserrat', sans-serif;
    font-size:9px;
    font-weight:600;
    letter-spacing:10px;
    text-transform:uppercase;
    color:#c9a961;
    margin-bottom:12px;
  }

  .magazine-title {
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:48px;
    letter-spacing:8px;
    background:linear-gradient(180deg, #e8d5a8 0%, #c9a961 50%, #8a6f3d 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1;
    padding-bottom:6px;
  }

  .magazine-sub {
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:14px;
    color:rgba(232,213,168,0.7);
    letter-spacing:4px;
    margin-top:8px;
  }

  /* ═══════════════════════════════════
     ԳՐՔԻ ԿՈՆՏԵՅՆԵՐ
     ═══════════════════════════════════ */
  .book-wrapper {
    position:relative;
    box-shadow:
      0 30px 80px rgba(0,0,0,0.8),
      0 0 60px rgba(201,169,97,0.15);
    margin:0 auto;
    max-width:100%;
  }

  #magazine {
    width:1040px;
    height:760px;
    margin:0 auto;
  }

  #magazine .page {
    background:#f5f0e8;
    overflow:hidden;
    position:relative;
    width:520px;
    height:760px;
    user-select:none;
    -webkit-user-select:none;
    -webkit-tap-highlight-color:transparent;
  }

  #magazine .page iframe {
    width:100%;
    height:100%;
    border:none;
    display:block;
    pointer-events:none;      /* ⬅️ Կարևոր՝ touch-ը չկլանի */
  }

  /* ═══════════════════════════════════
     ԿՈՃԱԿՆԵՐ
     ═══════════════════════════════════ */
  .controls {
    display:flex;
    justify-content:center;
    align-items:center;
    gap:20px;
    margin-top:20px;
    flex-shrink:0;
  }

  .ctrl-btn {
    font-family:'Montserrat', sans-serif;
    font-size:9px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#c9a961;
    background:rgba(13,13,13,0.7);
    border:1.5px solid rgba(201,169,97,0.5);
    border-radius:2px;
    padding:12px 24px;
    cursor:pointer;
    transition:all 0.3s ease;
    display:flex;
    align-items:center;
    gap:8px;
    backdrop-filter:blur(8px);
    -webkit-backdrop-filter:blur(8px);
    -webkit-tap-highlight-color:transparent;
  }

  .ctrl-btn:hover {
    background:rgba(201,169,97,0.15);
    border-color:#c9a961;
    color:#e8d5a8;
    transform:translateY(-2px);
    box-shadow:0 4px 15px rgba(201,169,97,0.3);
  }

  .ctrl-btn:disabled {
    opacity:0.3;
    cursor:not-allowed;
    transform:none;
  }

  .page-info {
    font-family:'Playfair Display', serif;
    font-style:italic;
    font-size:14px;
    color:#c9a961;
    letter-spacing:2px;
    min-width:80px;
    text-align:center;
  }

  .hint {
    margin-top:15px;
    font-family:'Montserrat', sans-serif;
    font-size:8px;
    font-weight:600;
    letter-spacing:4px;
    text-transform:uppercase;
    color:rgba(201,169,97,0.5);
    text-align:center;
    flex-shrink:0;
  }

  /* ═══════════════════════════════════
     TABLET
     ═══════════════════════════════════ */
  @media (max-width: 1100px) {
    .magazine-title { font-size:40px; letter-spacing:6px; }
    .magazine-sub { font-size:13px; }
  }

  /* ═══════════════════════════════════
     ՄՈԲԱՅԼ
     ═══════════════════════════════════ */
  @media (max-width: 700px) {
    body {
      padding:15px 10px;
      justify-content:flex-start;
      padding-top:80px;
    }

    .back-to-site {
      top:14px;
      right:14px;
      padding:8px 14px;
      font-size:7.5px;
      letter-spacing:2px;
    }

    .magazine-header {
      margin-bottom:15px;
    }

    .magazine-title { 
      font-size:28px; 
      letter-spacing:4px; 
    }
    .magazine-sub { 
      font-size:11px; 
      letter-spacing:3px;
    }
    .magazine-label {
      font-size:7px;
      letter-spacing:7px;
    }

    .book-wrapper {
      box-shadow:
        0 15px 40px rgba(0,0,0,0.8),
        0 0 30px rgba(201,169,97,0.15);
      width:100%;
    }

    #magazine {
      width:100% !important;
      height:auto !important;
      max-width:100% !important;
    }

    #magazine .page {
      width:100% !important;
      height:auto !important;
      aspect-ratio: 520 / 760;
    }

    .controls {
      gap:10px;
      margin-top:15px;
    }

    .ctrl-btn {
      font-size:8px;
      padding:10px 16px;
      letter-spacing:2px;
    }

    .page-info {
      font-size:12px;
      min-width:60px;
    }

    .hint {
      font-size:7px;
      letter-spacing:2px;
      margin-top:10px;
    }
  }

  /* ═══════════════════════════════════
     ՇԱՏ ՓՈՔՐ ԷԿՐԱՆ
     ═══════════════════════════════════ */
  @media (max-width: 400px) {
    .magazine-title { font-size:22px; }
    .ctrl-btn {
      padding:8px 12px;
      font-size:7px;
    }
  }
</style>
</head>
<body>

<!-- jQuery -->

<!-- Turn.js -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>

<script>
  $(document).ready(function() {

    if (typeof $.fn.turn === 'undefined') {
      alert('Turn.js չի բեռնվել! Ստուգիր internet-ը:');
      return;
    }

    // ═══ ՍՏՈՒԳԻՐ ԷԿՐԱՆԻ ՉԱՓԸ ═══
    var isMobile = window.innerWidth < 768;
    var isTablet = window.innerWidth >= 768 && window.innerWidth < 1100;

    // ═══ ՀԱՇՎԻ ՉԱՓԵՐԸ ═══
    var bookWidth, bookHeight, displayMode;

    if (isMobile) {
      // ՄՈԲԱՅԼ → SINGLE
      var screenWidth = Math.min(window.innerWidth - 30, 520);
      bookWidth = screenWidth;
      bookHeight = Math.round(screenWidth * (760 / 520));
      displayMode = 'single';
    } else if (isTablet) {
      // TABLET → DOUBLE
      bookWidth = 900;
      bookHeight = Math.round(900 * (760 / 1040));
      displayMode = 'double';
    } else {
      // DESKTOP → DOUBLE
      bookWidth = 1040;
      bookHeight = 760;
      displayMode = 'double';
    }

    // ═══ ՍՏԵՂԾԻՐ ԳԻՐՔԸ ═══
    $('#magazine').turn({
      width: bookWidth,
      height: bookHeight,
      autoCenter: true,
      display: displayMode,
      duration: 800,
      gradients: true,
      elevation: isMobile ? 15 : 50,
      acceleration: true,           // ⬅️ Կարևոր մոբայլի համար
      when: {
        turned: function(e, page) {
          var totalPages = $('#magazine').turn('pages');
          var visibleTotal = totalPages - 2;

          var displayPage;
          if (page === 1) {
            displayPage = 1;
          } else if (page >= totalPages) {
            displayPage = visibleTotal;
          } else {
            displayPage = page - 1;
          }

          $('#pageNum').text(displayPage);
          $('#totalPages').text(visibleTotal);

          $('#prevBtn').prop('disabled', page === 1);
          $('#nextBtn').prop('disabled', page === totalPages);
        }
      }
    });

    // ═══ ԿՈՃԱԿՆԵՐ ═══
    $('#prevBtn').click(function() {
      $('#magazine').turn('previous');
    });

    $('#nextBtn').click(function() {
      $('#magazine').turn('next');
    });

    // ═══ ՍՏԵՂՆԵՐ ═══
    $(document).keydown(function(e) {
      if (e.keyCode === 37) {
        $('#magazine').turn('previous');
      } else if (e.keyCode === 39) {
        $('#magazine').turn('next');
      }
    });

    // ═══ ՍԿԶԲՆԱԿԱՆ ═══
    $('#prevBtn').prop('disabled', true);

    // ═══ RESIZE ═══
    var resizeTimer;
    $(window).on('resize orientationchange', function() {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(function() {
        location.reload();
      }, 300);
    });

  });
</script>

</body>
