<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>VOGUE — Back Cover</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }

  body {
    background:#0d0d0d;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; padding:20px;
    font-family:'Cormorant Garamond', serif;
  }

  .page {
    position:relative;
    width:520px; height:740px;
    background:linear-gradient(160deg,#f5f0e8 0%,#efe8dc 50%,#e8ddd0 100%);
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.8);
    display:flex;
    flex-direction:column;
  }

  /* Ոսկե անկյուններ */
  .corner { position:absolute; width:50px; height:50px;
    border:1px solid rgba(201,169,97,0.8); z-index:10; }
  .corner.tl { top:20px; left:20px; border-right:none; border-bottom:none; }
  .corner.tr { top:20px; right:20px; border-left:none; border-bottom:none; }
  .corner.bl { bottom:20px; left:20px; border-right:none; border-top:none; }
  .corner.br { bottom:20px; right:20px; border-left:none; border-top:none; }

  /* Դեկոր աստղեր */
  .star {
    position:absolute;
    color:rgba(201,169,97,0.45);
    z-index:1;
    font-size:14px;
  }
  .s1 { top:80px; left:70px; }
  .s2 { top:150px; right:90px; font-size:18px; }
  .s3 { bottom:200px; left:100px; font-size:12px; }
  .s4 { top:45%; right:60px; font-size:16px; }
  .s5 { bottom:120px; right:80px; }

  /* ── ԿԵՆՏՐՈՆԱԿԱՆ ՀԱՏՎԱԾ ── */
  .main {
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
    position:relative;
    z-index:5;
    padding:40px;
  }

  .top-label {
    font-family:'Montserrat', sans-serif;
    font-size:8px;
    font-weight:600;
    letter-spacing:8px;
    text-transform:uppercase;
    color:#c9a961;
    margin-bottom:30px;
  }

  /* VOGUE լոգոն */
  .vogue-logo {
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-style:italic;
    font-size:92px;
    letter-spacing:12px;
    background:linear-gradient(180deg, #c9a961 0%, #8a6f3d 100%);
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
    background-clip:text;
    line-height:1;
    margin-bottom:14px;
    text-shadow:0 4px 20px rgba(201,169,97,0.25);
  }

  .vogue-sub {
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:14px;
    color:#8a7a5c;
    letter-spacing:4px;
    margin-bottom:30px;
  }

  .divider {
    width:80px;
    height:1px;
    background:linear-gradient(90deg, transparent, #c9a961, transparent);
    margin-bottom:30px;
  }

  /* Անուն */
  .name {
    font-family:'Playfair Display', serif;
    font-weight:900;
    font-size:42px;
    color:#1a1a1a;
    letter-spacing:10px;
    line-height:1;
    margin-bottom:8px;
    margin-left:10px;
  }

  .name-sub {
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:13px;
    color:#8a7a5c;
    letter-spacing:3px;
    margin-bottom:30px;
  }

  /* Փակագիծ */
  .quote {
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:15px;
    color:#2a2a2a;
    line-height:1.6;
    max-width:320px;
    margin-bottom:20px;
    letter-spacing:0.5px;
  }

  .quote em {
    font-style:normal;
    font-weight:600;
    color:#1a1a1a;
    background:linear-gradient(180deg, transparent 60%, rgba(201,169,97,0.4) 60%);
    padding:0 2px;
  }

  /* ── ՆԵՐՔԵՎԻ ՄԱՍ ── */
  .bottom {
    padding:0 40px 40px;
    text-align:center;
    position:relative;
    z-index:5;
  }

  .bottom-line {
    width:100%;
    height:1px;
    background:linear-gradient(90deg, transparent, rgba(201,169,97,0.6), transparent);
    margin-bottom:16px;
  }

  .info-row {
    display:flex;
    justify-content:space-between;
    align-items:center;
    font-family:'Montserrat', sans-serif;
    font-size:7px;
    font-weight:600;
    letter-spacing:3px;
    text-transform:uppercase;
    color:#8a7a5c;
  }

  .info-center {
    text-align:center;
    margin-top:12px;
    font-family:'Montserrat', sans-serif;
    font-size:7px;
    font-weight:600;
    letter-spacing:4px;
    text-transform:uppercase;
    color:#c9a961;
  }

  /* Շտրիխ կոդ */
  .barcode {
    position:absolute;
    bottom:40px;
    right:40px;
    z-index:10;
    text-align:center;
  }

  .barcode-lines {
    width:50px;
    height:26px;
    background:repeating-linear-gradient(90deg, #1a1a1a 0, #1a1a1a 2px, transparent 2px, transparent 4px);
    margin-bottom:3px;
  }

  .barcode-num {
    font-family:'Montserrat', sans-serif;
    font-size:6px;
    letter-spacing:2px;
    color:#8a7a5c;
  }
</style>
</head>
<body>

<div class="page">

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <!-- Դեկոր աստղեր -->
  <div class="star s1">✦</div>
  <div class="star s2">✧</div>
  <div class="star s3">✦</div>
  <div class="star s4">✧</div>
  <div class="star s5">✦</div>

  <div class="main">

    <div class="top-label">Back Cover</div>

    <div class="vogue-logo">VOGUE</div>
    <div class="vogue-sub">— Special Edition —</div>

    <div class="divider"></div>

    <div class="name">SONA</div>
    <div class="name-sub">— October 2026 —</div>

    <div class="quote">
      «Կյանքը գեղեցիկ է,<br>
      երբ <em>պարում ես</em>։»
    </div>

  </div>

  <div class="bottom">
    <div class="bottom-line"></div>
    <div class="info-row">
      <div>№ 01</div>
      <div>VOGUE</div>
      <div>2026</div>
    </div>
    <div class="info-center">
      Made with 💛 • For Sona
    </div>
  </div>

  <!-- Շտրիխ կոդ -->
  <div class="barcode">
    <div class="barcode-lines"></div>
    <div class="barcode-num">0 1 0 2 0 2 6</div>
  </div>

</div>

</body>
</html>
