<!DOCTYPE html>
<html lang="hy">
<head>
<meta charset="UTF-8">
<title>VOGUE — Siblings & Pride</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400;1,900&family=Cormorant+Garamond:wght@300;400;600;700&family=Montserrat:wght@300;400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="print.css">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    background:#0d0d0d;
    display:flex; justify-content:center; align-items:center;
    min-height:100vh; padding:20px;
    font-family:'Cormorant Garamond', serif;
  }

  .page {
    position:relative;
    width:520px; height:740px;
    background:#f5f0e8;
    overflow:hidden;
    box-shadow:0 30px 80px rgba(0,0,0,0.8);
    padding:35px 40px 30px;
    display:flex; flex-direction:column;
  }

  .corner { position:absolute; width:40px; height:40px;
    border:1px solid rgba(201,169,97,0.7); z-index:10; }
  .corner.tl { top:14px; left:14px; border-right:none; border-bottom:none; }
  .corner.tr { top:14px; right:14px; border-left:none; border-bottom:none; }
  .corner.bl { bottom:14px; left:14px; border-right:none; border-top:none; }
  .corner.br { bottom:14px; right:14px; border-left:none; border-top:none; }

  .header {
    display:flex; justify-content:space-between; align-items:center;
    padding-bottom:10px; border-bottom:1px solid rgba(0,0,0,0.15);
    margin-bottom:14px;
  }
  .header-left {
    font-family:'Playfair Display', serif;
    font-style:italic; font-weight:900; font-size:20px;
    letter-spacing:4px; color:#1a1a1a;
  }
  .header-right {
    font-family:'Montserrat', sans-serif; font-size:7px;
    font-weight:600; letter-spacing:4px; text-transform:uppercase;
    color:#8a7a5c; text-align:right;
  }

  .page-label {
    text-align:center; font-family:'Montserrat', sans-serif;
    font-size:7px; font-weight:600; letter-spacing:7px;
    text-transform:uppercase; color:#c9a961; margin-bottom:6px;
  }
  .title {
    text-align:center; font-family:'Playfair Display', serif;
    font-weight:900; font-style:italic; font-size:23px;
    line-height:1.15; color:#1a1a1a; margin-bottom:4px;
  }
  .title-ornament {
    text-align:center; color:#c9a961; font-size:11px;
    letter-spacing:7px; margin-bottom:12px;
  }

  .sibling-duo {
    display:grid; grid-template-columns:1fr 1fr;
    gap:14px; margin-bottom:10px;
    width:85%; margin-left:auto; margin-right:auto;
  }
  .sibling-item {
    position:relative;
    height:165px;
    padding:5px; background:#fff;
    box-shadow:0 5px 18px rgba(0,0,0,0.12);
  }
  .sibling-item:nth-child(1) { transform:rotate(-1.5deg); }
  .sibling-item:nth-child(2) { transform:rotate(1.5deg); }
  .sibling-item img {
    width:100%; height:100%;
    object-fit:cover; display:block;
    filter:sepia(0.1) contrast(1.02);
  }
  .sibling-item .placeholder {
    width:100%; height:100%;
    background:linear-gradient(135deg,#e8ddd8 0%,#d4c5b0 100%);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    color:#8a7a5c; font-family:'Montserrat', sans-serif;
    font-size:8px; letter-spacing:2px; text-align:center;
    padding:8px;
  }
  .sibling-item .placeholder span { font-size:22px; margin-bottom:4px; }

  .sibling-caption {
    text-align:center; font-family:'Cormorant Garamond', serif;
    font-style:italic; font-size:12px; color:#8a7a5c;
    margin-bottom:10px;
  }

  .sibling-text {
    text-align:center;
    font-family:'Playfair Display', serif;
    font-style:italic; font-weight:700;
    font-size:14px; color:#1a1a1a;
    line-height:1.35; margin-bottom:14px;
    padding:0 10px;
  }

  /* ⬆️ ԶԻՆՎՈՐԱԿԱՆ — ՈՍԿԵ/ՇԱՄՊԱՅՆ ՖՈՆ ⬆️ */
  .soldier-section {
    position:relative;
    background:linear-gradient(180deg,#3a3020 0%,#4a3f28 100%);
    padding:16px;
    margin-top:auto;
    border:1px solid rgba(201,169,97,0.6);
    box-shadow:0 10px 30px rgba(0,0,0,0.25);
    width:90%; margin-left:auto; margin-right:auto;
    display:flex;
    gap:16px;
    align-items:center;
  }

  .soldier-section::before,
  .soldier-section::after {
    content:"";
    position:absolute;
    width:16px; height:16px;
    border:1px solid #e8d5a8;
  }
  .soldier-section::before {
    top:5px; left:5px;
    border-right:none; border-bottom:none;
  }
  .soldier-section::after {
    bottom:5px; right:5px;
    border-left:none; border-top:none;
  }

  .soldier-photo {
    position:relative;
    width:120px;
    height:170px;
    flex-shrink:0;
    padding:4px; background:#fff;
  }
  .soldier-photo img {
    width:100%; height:100%;
    object-fit:cover; display:block;
    filter:sepia(0.15) contrast(1.05);
  }
  .soldier-photo .placeholder {
    width:100%; height:100%;
    background:linear-gradient(135deg,#4a3f28 0%,#3a3020 100%);
    display:flex; flex-direction:column;
    justify-content:center; align-items:center;
    color:#e8d5a8;
    font-family:'Montserrat', sans-serif;
    font-size:8px; letter-spacing:2px; text-align:center;
    padding:10px;
  }
  .soldier-photo .placeholder span { font-size:26px; margin-bottom:6px; }

  .soldier-text {
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }

  .soldier-label {
    font-family:'Montserrat', sans-serif;
    font-size:7px; font-weight:600;
    letter-spacing:5px; text-transform:uppercase;
    color:#e8d5a8;
    margin-bottom:8px;
  }

  .soldier-caption {
    font-family:'Playfair Display', serif;
    font-style:italic; font-weight:700;
    font-size:13px; color:#fff;
    line-height:1.4;
    text-shadow:0 2px 10px rgba(0,0,0,0.4);
  }
  .soldier-caption .gold {
    color:#e8d5a8;
    font-size:9px;
    letter-spacing:3px;
    text-transform:uppercase;
    font-style:normal;
    font-family:'Montserrat', sans-serif;
    font-weight:600;
    display:block;
    margin-top:8px;
  }

  .footer {
    display:flex; justify-content:space-between; align-items:center;
    padding-top:10px; border-top:1px solid rgba(0,0,0,0.15);
    margin-top:12px;
  }
  .page-number {
    font-family:'Playfair Display', serif;
    font-style:italic; font-size:15px; color:#c9a961;
  }
  .footer-text {
    font-family:'Montserrat', sans-serif; font-size:7px;
    font-weight:600; letter-spacing:4px; text-transform:uppercase;
    color:#8a7a5c;
  }
</style>
</head>
<body>

<div class="page">

  <div class="corner tl"></div>
  <div class="corner tr"></div>
  <div class="corner bl"></div>
  <div class="corner br"></div>

  <div class="header">
    <div class="header-left">Vogue</div>
    <div class="header-right">
      October 2026<br>
      Special Edition
    </div>
  </div>

  <div class="page-label">Family Ties & Golden Memories</div>
  <div class="title">Մանկության կատակներ,<br>հավերժական կապ</div>
  <div class="title-ornament">✦ ✦ ✦</div>

  <div class="sibling-duo">
    <div class="sibling-item">
      <img src="sis.png" alt="Sister">
    </div>
    <div class="sibling-item">
      <img src="bro.png" alt="Brother">
    </div>
  </div>

  <div class="sibling-caption">— Քույր և եղբայր —</div>

  <div class="sibling-text">
    «Մանկության անհոգ օրեր,<br>որ միշտ սրտում են»
  </div>

  <div class="soldier-section">
    <div class="soldier-photo">
      <img src="soldier.png" alt="Soldier brother">
    </div>

    <div class="soldier-text">
      <div class="soldier-label">Հպարտություն & Ուժ</div>
      <div class="soldier-caption">
        «Եղբոր կողքին՝ ամենաարժեքավոր պահերից մեկը»
        <span class="gold">Honor • Strength • Pride</span>
      </div>
    </div>
  </div>

  <div class="footer">
    <div class="page-number">04</div>
    <div class="footer-text">Vogue • Family Edition</div>
  </div>

</div>

</body>
</html>
